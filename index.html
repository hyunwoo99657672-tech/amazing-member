<title>어메이징석계 운동파트너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 한 손 엄지로 쓰는 단일 컬럼. 화면마다 큰 버튼 하나가 주인공, 나머지는 조용하게. */
:root{
  --bg:#f3f2ec; --surface:#ffffff; --sunk:#ebeae2; --ink:#1c2620; --muted:#5a665e; --line:#dcdfd5;
  --accent:#245b38; --accent-ink:#ffffff; --accent-soft:#e2ecdc; --warm:#93561a; --warm-soft:#f6ead9;
  --danger:#a9392a; --danger-soft:#f8e3de;
  --m-p:#de4f39; --m-s:#eeb030; --m-a:#3f86d4; --m-off:#d5cfc8; --m-body:#ebe7e2; --m-edge:#aaa198;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1a221d; --sunk:#151c17; --ink:#ecf1ea; --muted:#a2aea5; --line:#2b3730;
  --accent:#74c48d; --accent-ink:#0b1a10; --accent-soft:#1d3224; --warm:#e3a55c; --warm-soft:#33281b;
  --danger:#ff8b78; --danger-soft:#3a201b; --m-p:#ff6a52; --m-s:#f5c04f; --m-a:#5ea2ee; --m-off:#3c4741; --m-body:#29312c; --m-edge:#5c6862; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1a221d; --sunk:#151c17; --ink:#ecf1ea; --muted:#a2aea5; --line:#2b3730;
  --accent:#74c48d; --accent-ink:#0b1a10; --accent-soft:#1d3224; --warm:#e3a55c; --warm-soft:#33281b;
  --danger:#ff8b78; --danger-soft:#3a201b; --m-p:#ff6a52; --m-s:#f5c04f; --m-a:#5ea2ee; --m-off:#3c4741; --m-body:#29312c; --m-edge:#5c6862; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 18px/1.65 var(--body);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.3}
h2{font-size:26px;line-height:1.35}
h3{font-size:21px;line-height:1.4}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.55}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 22px/1 var(--display);flex:none}
.brand b{display:block;font-size:16px;line-height:1.3}
.brand small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.back{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;min-height:44px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border-radius:var(--r-md);border:0;padding:14px 18px;font-weight:800;font-size:20px;line-height:1.3;text-align:center}
.btn-main{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn-main:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn-soft{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-quiet{background:none;border:0;color:var(--muted);font-weight:700;font-size:16px;min-height:48px;text-decoration:underline;text-underline-offset:4px}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn small{display:block;font-weight:500;font-size:15px;opacity:.85}

/* home */
.hello{padding:18px 0 4px}
.hello .kicker{font-size:16px;color:var(--warm);font-weight:800;margin-bottom:6px}
.hero-btn{flex-direction:column;align-items:flex-start;text-align:left;min-height:132px;padding:22px 22px;border-radius:var(--r-lg);font-size:26px;font-family:var(--display);font-weight:400;gap:6px;position:relative;overflow:hidden}
.hero-btn small{font-family:var(--body);font-size:16px;font-weight:500}
.hero-btn .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);display:grid;place-items:center;font-size:24px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile b{font-size:18px;line-height:1.35}
.tile span{font-size:14px;color:var(--muted);line-height:1.45}
.tile .ic{font-size:24px;line-height:1}
.confidence{background:var(--warm-soft);border-radius:var(--r-md);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.confidence .num{font:400 30px/1 var(--display);color:var(--warm);flex:none;min-width:44px;text-align:center;padding-top:2px}
.confidence p{font-size:16px;line-height:1.55}
.weekdots{display:flex;gap:6px;margin-top:8px}
.weekdots i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.weekdots i.on{background:var(--accent)}
.foot-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}

/* choice chips */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-height:60px;text-align:left;font-weight:700;font-size:18px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.choice small{font-weight:500;font-size:14px;color:var(--muted);line-height:1.45}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.choices.three .choice{text-align:center;align-items:center;padding:12px 8px}
.field label{display:block;font-weight:800;margin-bottom:8px}
.text-in{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.text-in:focus{border-color:var(--accent);outline:none}
.crit{background:var(--accent-soft);border-radius:var(--r-md);padding:14px 16px;font-size:17px;line-height:1.55}
.choice.lvl{min-height:76px;font-size:22px;font-family:var(--display);font-weight:400}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.progress i.on{background:var(--accent)}
.step-label{font-size:15px;font-weight:800;color:var(--warm)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.note{background:var(--sunk);border-radius:var(--r-md);padding:14px 16px;font-size:16px;line-height:1.6}
.note.warn{background:var(--danger-soft);color:var(--ink)}
.note b{display:block;margin-bottom:2px}.note strong{font-weight:800}

/* plan list */
.plan-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan-meta div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.plan-meta b{display:block;font:400 24px/1.2 var(--display);color:var(--accent)}
.plan-meta span{font-size:13px;color:var(--muted)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px 10px 10px}
.plan-item.cardio{grid-template-columns:64px 1fr}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-size:26px;color:var(--muted)}
.thumb{position:relative}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.plan-item b{display:block;font-size:18px;line-height:1.35}
.plan-item span{font-size:14px;color:var(--muted);line-height:1.4}
.how{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:800;min-height:40px;white-space:nowrap}

/* media */
.media{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block;background:var(--sunk)}
.media .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:15px;padding:20px}
.media .fallback .big{font-size:42px;display:block;margin-bottom:6px}
.media.has-img .fallback{display:none}
.media.noimg img{display:none}
.media.noimg .fallback{display:grid}
.play{position:absolute;left:12px;bottom:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px;min-height:46px;box-shadow:0 2px 10px #0003}
.media-err{font-size:14px;color:var(--danger);margin-top:6px}

/* exercise screen */
.ex-head{display:flex;flex-direction:column;gap:6px}
.chip-ai{background:var(--warm-soft)!important;color:var(--warm)!important}
.chip{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800}
.cues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cues li{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.55}
.cues li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:9px}
.set-box{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.set-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.set-top h2{font-size:28px}
.set-dots{display:flex;gap:6px}
.set-dots i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-style:normal;font-weight:800;color:var(--muted)}
.set-dots i.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set-dots i.now{border-color:var(--accent);color:var(--accent)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.steppers.one{grid-template-columns:1fr}
.stepper{background:var(--sunk);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper label{font-size:14px;color:var(--muted);font-weight:700}
.stepper .ctrl{display:flex;align-items:center;gap:6px;width:100%;justify-content:space-between}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:800;flex:none}
.stepper input{width:100%;min-width:0;text-align:center;font:400 28px/1 var(--display);border:0;background:none;color:var(--ink);padding:4px 0}
.stepper input::placeholder{color:var(--muted);font-size:18px}
.hint{font-size:15px;color:var(--warm);font-weight:700;line-height:1.5}
.ex-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ex-tools button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted);min-height:44px}

/* rest */
.rest{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:12px}
.ring{width:220px;height:220px;max-width:70vw;max-height:70vw;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:400 56px/1 var(--display);color:var(--accent)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.next-up{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;width:100%;text-align:left}

/* sheet / details */
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
details.more>summary{list-style:none;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:52px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";color:var(--accent);font-size:20px}
details.more[open]>summary::after{content:"－"}
details.more .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.steps-n{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps-n li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
.steps-n li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.steps-n b{display:block;font-size:17px}
.steps-n span{font-size:15px;color:var(--muted);line-height:1.6}

/* guide list */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;min-height:44px}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.gcard .ph{aspect-ratio:1/1;background:var(--sunk);display:grid;place-items:center;font-size:36px;color:var(--muted);position:relative}
.gcard .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.gcard .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.gcard b{font-size:17px;line-height:1.35}
.gcard span{font-size:13px;color:var(--muted);line-height:1.4}
.big-steps{display:flex;flex-direction:column;gap:12px}
.bstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.bstep .n{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 22px/1 var(--display)}
.bstep h3{font-size:20px;margin-bottom:4px}
.bstep ul{margin:0;padding-left:18px;font-size:16px;line-height:1.6;color:var(--ink)}
.bstep ul li+li{margin-top:4px}
.breath{display:flex;flex-direction:column;gap:4px;font-size:16px;line-height:1.6}
.breath em{font-style:normal;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:1px 10px;align-self:flex-start;font-size:14px;margin-top:6px}
.breath em:first-child{margin-top:0}

/* done */
.done-hero{text-align:center;padding:26px 0 6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.medal{width:96px;height:96px;border-radius:50%;background:var(--warm-soft);color:var(--warm);display:grid;place-items:center;font:400 44px/1 var(--display)}
.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.done-list li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.done-list li:last-child{border-bottom:0}

/* records */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px;text-align:center}
.stats b{display:block;font:400 30px/1.1 var(--display);color:var(--accent)}
.stats span{font-size:13px;color:var(--muted)}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.log-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.log-h b{font-size:17px}
.log ul{margin:0;padding:0;list-style:none;font-size:15px;color:var(--muted);line-height:1.7}
.icon-btn{background:none;border:0;color:var(--muted);font-size:14px;font-weight:700;min-height:40px;padding:4px 8px;text-decoration:underline}

.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.mstat span{display:block;font-size:13px;color:var(--muted)}
.mstat b{font-size:16px}
.spark{width:100%;height:56px;display:block;margin-top:6px}
.spark .sl{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
.spark .sa{fill:var(--accent-soft);stroke:none}
.spark .sd{fill:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px;margin-top:6px}
.cal i{font-style:normal;color:var(--muted);font-size:13px;font-weight:700}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal span.today{outline:2px solid var(--warm);outline-offset:-2px}
.edit-rows{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.edit-rows label{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.edit-rows input{width:72px;font:inherit;font-size:17px;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.start-card{display:flex;gap:14px;align-items:center;text-align:left;background:var(--warm-soft);border:0;border-radius:var(--r-md);padding:16px 18px;width:100%}
.start-card .num{font:400 30px/1 var(--display);color:var(--warm)}

 핀이 모두 걸렸어요 (흔들어 확인)", "무게 핀을 살짝 당겨도 안 빠져요"], "mist": ["무릎이 회전축보다 앞이나 뒤에 있어요 → 등받이를 다시 맞춰요.", "엉덩이가 들려요 → 손잡이를 당겨 눌러요.", "발로 \"툭\" 차올려 반동을 써요."], "pain": [["무릎뼈 바로 아래(앞쪽)가 찌릿해요", "시작 각도가 너무 깊거나 무게가 무거워요. 범위 레버로 시작 각도를 줄이고 무게를 한 칸 내려요."], ["정강이 앞이 눌려 아파요", "발목 패드가 너무 위(정강이)에 있어요. 패드를 발등 바로 위로 내려요."], ["무릎 안쪽 깊은 곳이 아파요", "무릎과 회전축이 어긋났어요. 등받이를 다시 맞춰요. 계속되면 이 운동은 쉬어요."]], "ok": "허벅지 앞쪽이 타는 듯 뜨거워지는 건 정상이에요.", "coach": true, "aiText": false}, "9": {"name": "V스쿼트", "model": "LEXCO LF-511", "part": "허벅지 앞쪽 · 엉덩이", "group": "lower", "setup": [["안전 봉(시작 높이) 맞추기", "기구 옆의 안전 핀·봉을 내 키와 움직일 범위에 맞는 구멍에 꽂아요. 이 봉이 \"여기보다 더 내려가지 않게\" 막아줘요. 처음엔 깊지 않은 칸으로 해요."], ["원판 끼우기", "양쪽에 같은 무게로 끼워요. 처음엔 원판 없이 기구 무게로 연습해요."], ["어깨 패드 아래로 들어가기", "어깨 패드 아래로 들어가 패드를 양어깨(쇄골 옆 살 있는 곳)에 딱 붙여요. 등받이에 등을 기대요."], ["발 위치 정하기", "발판에 어깨너비로 서요. 발을 몸 쪽 가까이 두면 스쿼트처럼 허벅지 앞·엉덩이 전체를, 발을 앞쪽에 두면 허벅지 뒤·엉덩이를 더 써요."], ["걸쇠 풀기", "무릎을 살짝 펴서 무게를 받친 뒤, 옆 레버(발로 미는 손잡이)로 걸쇠를 풀어요. 끝나면 발을 몸 가까이 두고 같은 레버로 다시 걸어요."]], "posture": ["등이 등받이에 붙어 있어요.", "발바닥 전체로 서고 뒤꿈치가 뜨지 않아요.", "무릎이 발끝 방향을 향해요.", "발바닥으로 바닥을 밀어 엉덩이를 등받이 쪽으로 눌렀어요."], "motion": [["앉기 (2~3초)", "숨을 들이마시며 엉덩이를 뒤로 빼듯 천천히 앉아요. 허리가 둥글게 말리기 전, 허벅지가 바닥과 나란할 즈음 멈춰요."], ["일어서기", "숨을 \"후\" 내쉬며 발바닥 전체로 바닥을 밀어 일어서요. 무릎은 끝에서 쭉 잠그지 않아요."]], "caution": "앉을 때 뒤꿈치가 들려요 → 발을 조금 앞으로. 무릎이 안으로 모여요.", "quick": ["어깨는 패드에, 등은 등받이에.", "허리가 말리기 전까지만 앉아요.", "발바닥 전체로 밀어 일어서요."], "feel": "허벅지 앞쪽과 엉덩이가 함께 일하는 느낌이에요.", "stop": "무릎이 시큰하거나 허리가 뜨끔하면 멈추고 깊이를 줄여요.", "photo": "assets/vsquat-machine.jpg", "video": "assets/vsquat-actual.mp4", "ai": ["assets/vsquat-male.mp4", "assets/vsquat-female.mp4"], "thumb": "assets/vsquat-machine.jpg", "vposter": "assets/vsquat-actual.poster.jpg", "mus": {"p": ["quads", "glutes"], "s": ["adductors", "lowerBack"], "a": ["hamstrings"]}, "vary": [["발을 앞쪽에", "엉덩이를 뒤로 빼기 쉬워서 엉덩이를 더 써요."], ["발을 몸 아래쪽에", "무릎이 앞으로 나가며 허벅지 앞쪽을 더 써요."], ["발을 넓게", "허벅지 안쪽·엉덩이를 함께 써요."]], "lock": ["안전 봉이 양쪽 다 끝까지 꽂혔어요", "양쪽 원판 무게가 같아요", "어깨 패드가 양어깨에 고르게 닿아요", "걸쇠 거는 레버 위치를 알아요"], "mist": ["앉을 때 뒤꿈치 , "엄지선이 귀 뒤로.", "어깨는 으쓱하지 않아요."], "mus": {"p": ["rearDelts", "upperBack"], "s": ["sideDelts"], "a": ["chest"]}, "vary": [["도르래를 눈보다 조금 위에", "어깨 뒤쪽과 어깨 속 근육(회전근)을 가장 잘 써요. 기본 자세예요."], ["도르래를 가슴 높이로 낮추면", "날개뼈 사이(등 가운데)를 더 써서 로우에 가까워져요."], ["팔꿈치를 어깨 높이로 높게", "어깨 뒤쪽에 집중돼요."], ["팔꿈치가 아래로 내려가면", "등과 팔 앞쪽이 대신 일해서 효과가 줄어요."], ["엄지가 하늘을 보게 잡기", "어깨가 바깥으로 자연스럽게 돌아가 어깨 건강에 좋아요."]], "lock": ["도르래 핀이 걸렸어요", "로프 고리가 닫혔어요", "팔을 뻗었을 때 무게추가 살짝 떠 있어요"], "mist": ["승모근(어깨 윗부분)이 으쓱 들려요.", "그냥 잡아당기기만 해서 팔꿈치가 내려가요.", "몸을 뒤로 젖혀 체중으로 당겨요."], "pain": [["어깨 위·목 옆이 뻐근하게 아파요", "어깨가 으쓱 올라갔어요. 무게를 내리고 어깨를 내린 뒤 당겨요."], ["어깨 앞쪽이 찌릿해요", "팔꿈치가 너무 낮거나 손이 너무 뒤로 갔어요. 팔꿈치를 어깨 높이로 올리고 범위를 줄여요."], ["손목이 꺾여 아파요", "로프를 손등 쪽으로 꺾어 잡았어요. 엄지가 위를 보게 곧게 잡아요."]], "ok": "어깨 뒤와 날개뼈 사이가 조이면 정상이에요."}}, "stretch": [{"key": "chest", "title": "가슴 열기", "area": "가슴 · 앞쪽 어깨", "both": false, "how": "편하게 서서 어깨를 내리고 팔을 천천히 벌려 가슴 앞쪽을 열어요. 허리는 길게 유지해요.", "avoid": "어깨를 뒤로 세게 당기거나 허리를 꺾지 않아요.", "video": "assets/stretch/01-chest-10s.mp4", "poster": "assets/stretch/01-chest-10s.jpg"}, {"key": "shoulder", "title": "어깨 뒤쪽", "area": "어깨 뒤쪽", "both": true, "how": "한 팔을 가슴 앞으로 가져와 반대 손으로 위팔을 가볍게 받쳐요. 어깨는 귀에서 멀어지게 내려요.", "avoid": "팔꿈치 관절을 세게 누르거나 아픈 쪽으로 억지로 당기지 않아요.", "video": "assets/stretch/02-shoulder-10s.mp4", "poster": "assets/stretch/02-shoulder-10s.jpg"}, {"key": "triceps", "title": "팔 뒤쪽", "area": "팔 뒤쪽 · 삼두근", "both": true, "how": "한 팔꿈치를 머리 옆으로 올리고 손은 등 쪽으로 편하게 내려요. 반대 손으로 팔꿈치를 가볍게 받쳐요.", "avoid": "갈비뼈를 들거나 허리를 젖히지 않아요. 팔을 올리는 것부터 불편하면 건너뛰어요.", "video": "assets/stretch/03-triceps-10s.mp4", "poster": "assets/stretch/03-triceps-10s.jpg"}, {"key": "side", "title": "옆구리", "area": "몸통 옆쪽", "both": true, "how": "양발을 편하게 벌린 채 한 팔을 머리 위로 올리고 몸통을 옆으로 조금 기울여요. 가슴은 앞을 향해요.", "avoid": "몸을 앞으로 숙이거나 비틀지 않아요. 깊이보다 편안한 범위가 먼저예요.", "video": "assets/stretch/04-side-10s.mp4", "poster": "assets/stretch/04-side-10s.jpg"}, {"key": "back", "title": "등 늘리기", "area": "등 · 몸통", "both": false, "how": "매트에 무릎을 대고 손을 앞으로 뻗어요. 엉덩이를 발뒤꿈치 쪽으로 편하게 보내며 등을 길게 늘려요.", "avoid": "무릎이나 손목이 불편하면 건너뛰어요. 목을 억지로 숙이거나 허리를 누르지 않아요.", "video": "assets/stretch/05-back-10s.mp4", "poster": "assets/stretch/05-back-10s.jpg"}, {"key": "quads", "title": "허벅지 앞쪽", "area": "허벅지 앞쪽 · 대퇴사두근", "both": true, "how": "벽이나 고정된 난간을 한 손으로 잡고, 반대 무릎을 굽혀 같은 쪽 발목을 편하게 잡아요. 양 무릎은 가까이 둬요.", "avoid": "발목이 닿지 않으면 억지로 잡지 않아요. 무릎을 뒤로 당기거나 허리를 꺾지 않아요.", "video": "assets/stretch/06-quads-10s.mp4", "poster": "assets/stretch/06-quads-10s.jpg"}, {"key": "hamstrings", "title": "허벅지 뒤쪽", "area": "허벅지 뒤쪽 · 햄스트링", "both": true, "how": "튼튼한 의자 끝에 앉아 한쪽 뒤꿈치를 앞으로 놓아요. 등을 길게 유지하며 골반에서 조금만 숙여요.", "avoid": "영상의 깊이를 따라가기보다 허리를 길게 유지해요. 무릎 뒤 통증이나 저림이 있으면 멈춰요.", "video": "assets/stretch/07-hamstrings-10s.mp4", "poster": "assets/stretch/07-hamstrings-10s.jpg"}, {"key": "glutes", "title": "엉덩이", "area": "엉덩이", "both": true, "how": "튼튼한 의자에 앉아 한쪽 발목을 반대 허벅지 위에 편하게 올려요. 허리를 길게 유지하며 골반에서 조금 숙여요.", "avoid": "무릎을 손으로 누르지 않아요. 다리를 올리는 것부터 불편하면 건너뛰어요.", "video": "assets/stretch/08-glutes-10s.mp4", "poster": "assets/stretch/08-glutes-10s.jpg"}, {"key": "calves", "title": "종아리", "area": "종아리 뒤쪽", "both": true, "how": "벽을 짚고 한 발을 뒤에 둬요. 뒷발 뒤꿈치를 붙인 채 앞 무릎을 발끝 방향으로 조금 굽혀요.", "avoid": "뒤꿈치가 뜨기 전에 멈춰요. 무릎을 잠그거나 아킬레스건 통증을 참지 않아요.", "video": "assets/stretch/09-calves-10s.mp4", "poster": "assets/stretch/09-calves-10s.jpg"}], "reg": {"quads": "허벅지 앞쪽 (대퇴사두근)", "glutes": "엉덩이 (대둔근)", "sideGlutes": "엉덩이 옆쪽 (중둔근)", "hamstrings": "허벅지 뒤쪽 (햄스트링)", "adductors": "허벅지 안쪽 (내전근)", "calves": "종아리 (비복근)", "tfl": "골반 바깥 앞쪽 (대퇴근막장근)", "abs": "배·코어 (복근)", "lowerBack": "허리 (척추기립근)", "chest": "가슴 (대흉근)", "chestUpper": "윗가슴 (대흉근 위쪽)", "frontDelts": "어깨 앞쪽 (전면 삼각근)", "sideDelts": "어깨 옆쪽 (측면 삼각근)", "rearDelts": "어깨 뒤쪽 (후면 삼각근)", "triceps": "팔 뒤쪽 (삼두근)", "biceps": "팔 앞쪽 (이두근)", "lats": "등 옆쪽 (광배근)", "upperBack": "날개뼈 사이 (능형근·승모근)", "forearms": "아래팔 (전완근)"}, "bm": {"res": {"F": [["chest", "M272.91 422.84c-18.95-17.19-22-57-12.64-78.79 5.57-12.99 26.54-24.37 39.97-25.87q20.36-2.26 37.02.75c9.74 1.76 16.13 15.64 18.41 25.0   if(kind(e.id)==='body') return {kg:null,text:last?`지난번 ${last.records[last.records.length-1].reps}회 했어요. 오늘은 1~2회만 더 해봐요.`:'맨몸 운동이에요. 작은 범위부터 천천히 해봐요.'};
  if(!last) return {kg:null,first:true,text:'처음 쓰는 기구예요. 가장 가벼운 무게로 5번 연습해보고, 10번을 편하게 할 수 있는 무게를 찾아요.'};
  // 한 세트만 무겁게 든 경우가 아니라, 목표 근처 횟수를 해낸 '작업 세트' 무게를 기준으로 해요
  const top=r=>{const ok=r.records.filter(x=>x.kg>0&&(x.reps||0)>=Math.max(5,(e.repMin||10)-2));const src=ok.length?ok:r.records;return Math.max(...src.map(x=>x.kg||0))||null};
  const kg=top(last), lastReps=last.records[last.records.length-1].reps, max=last.repMax||e.repMax, step=stepOf(e.id);
  const allTop=last.records.every(r=>r.reps>=max);
  if(kg==null) return {kg:null,text:'지난번엔 무게를 안 적었어요. 오늘 적어두면 다음부터 무게를 맞춰드려요.'};
  if(last.formDrop) return {kg,text:`지난번 자세가 흔들려서 ${kg}kg으로 내렸어요. 오늘은 이 무게로 자세부터 단단하게 만들어요.`};
  if(last.effort==='hard'&&lastReps<e.repMin&&kg-step>0) return {kg:kg-step,text:`지난번 ${kg}kg에서 목표 횟수를 못 채웠어요. 오늘은 한 칸 내려서(예: ${kg-step}kg) 자세에 집중해요. 내리는 것도 성장 과정이에요.`};
  if(last.effort==='hard') return {kg,text:`지난번 ${kg}kg이 힘들었어요. 같은 무게로 천천히, 횟수를 하나씩 늘려봐요.`};
  const prev=H[1], easyTwice=last.effort==='easy'&&prev&&prev.effort==='easy'&&top(prev)===kg;
  if(allTop||easyTwice) return {kg:kg+step,up:true,text:`지난번 ${kg}kg${allTop?'으로 목표를 다 채웠어요!':'이 두 번 연속 쉬웠어요!'} 오늘은 ${UNIT(e.id)}만 올려봐요(예: ${kg+step}kg). 올리면 횟수가 줄어드는 게 정상이에요. ${e.repMin}회부터 다시 쌓아요.`};
  if(last.effort==='easy') return {kg,text:`지난번 ${kg}kg이 쉬웠어요. 오늘 ${max}회까지 채워보고, 다음에도 쉬우면 그때 올려요.`};
  if(H.length===3&&H.every(h=>top(h)===kg)&&!H.some(h=>h.records.every(r=>r.reps>=max))) return {kg,plateau:true,text:`${kg}kg으로 3번째예요. 쉬는 시간을 꼭 지키고, 내려올 때 2~3초 천천히 해보세요. 계속 막히면 '성장 가이드'의 정체기 방법을 써봐요.`};
  return {kg,text:`지난번 ${kg}kg × ${lastReps}회. 오늘은 같은 무게로 한두 번만 더 해봐요. ${max}회를 모든 세트에서 채우면 다음에 올려요.`};
}


/* ---------- growth (PR + next weight) ---------- */
function topKg(i){const k=Math.max(...(i.records||[]).map(r=>r.kg||0));return k>0?k:null}
function prsOf(l){const idx=data.logs.indexOf(l);if(idx<0)return [];const out=[];
  (l.items||[]).forEach(i=>{if(i.cardio||!i.id)return;const k=topKg(i);if(k==null)return;let best=null;
    for(let j=0;j<idx;j++){const it=(data.logs[j].items||[]).find(x=>x.id===i.id);if(it){const b=topKg(it);if(b!=null&&(best==null||b>best))best=b}}
    if(best!=null&&k>best)out.push({name:i.name,kg:k,gain:+(k-best).toFixed(1)})});return out}
function nextTips(l){return (l.items||[]).filter(i=>!i.cardio&&i.id&&EX[i.id]&&kind(i.id)!=='body'&&topKg(i)!=null).map(i=>{const mx=i.repMax||12;const sg=suggestion({id:i.id,repMax:mx,repMin:Math.max(1,mx-4)});return {name:i.name,sg}}).filter(x=>x.sg.up||(x.sg.kg!=null&&x.sg.kg<topKg(l.items.find(i=>i.name===x.name)))).slice(0,4)}
function gainsAll(){const by={};data.logs.forEach(l=>(l.items||[]).forEach(i=>{if(i.cardio||!i.id)return;const k=topKg(i);if(k==null)return;const o=by[i.id]=by[i.id]||{name:i.name,first:k,best:k,n:0};o.best=Math.max(o.best,k);o.n++}));
  return Object.values(by).filter(o=>o.n>=2&&o.best>o.first).map(o=>({...o,gain:+(o.best-o.first).toFixed(1)})).sort((a,b)=>b.gain-a.gain)}
function growCard(){const g=gainsAll();if(!g.length)return '';const t=g[0];
  return `<button class="grow-card" data-go="records" data-tab="machines"><span class="gc-ic" aria-hidden="true">📈</span><span class="gc-t"><small>내 성장</small><b>${esc(t.name)} 처음보다 <em>+${t.gain}kg</em></b><span>${g.length>1?`외 ${g.length-1}개 기구도 무게가 늘었어요`:'기구별 성장 그래프 보기'}</span></span><span class="arrow" aria-hidden="true">→</span></button>`}

workout(){
  const s=data.active; if(!s) return SCREENS.home();

  const bar=`<div class="progress" aria-label="진행">${[{w:1},...s.queue,{w:1}].map((e,k)=>{const idx=k-1;const on=s.phase==='done'||(s.phase==='walk')||(idx<s.index)||(idx===s.index&&s.phase!=='warm')||(k===0&&s.phase!=='warm');return `<i class="${on?'on':''}"></i>`}).join('')}</div>`;
  const tools=`<div class="ex-tools"><button data-act="pain">통증이 있어요</button><button data-act="quit">오늘은 여기까지</button></div>`;
  const vbtn='speechSynthesis' in window?`<button class="voice ${data.voice?'on':''}" data-act="voice" aria-pressed="${!!data.voice}">${data.voice?'🔊 음성 안내 켜짐':'🔈 음성 안내 켜기'}</button>`:'';

    <div class="stack"><p class="step-label">준비 · 몸 풀기</p><h1>먼저 ${s.warm}분만<br>걸어볼까요?</h1><p class="muted">6층 트레드밀 · 대화할 수 있는 속도 (시속 4~5km)</p></div>
    <button class="btn btn-main" data-act="warm-done">다 걸었어요 · 첫 기구로</button>
    ${vbtn?`<div class="ex-tools">${vbtn}</div>`:''}

records(){

  if(!data.logs.length&&tab!=='badges') body=`<div class="note">아직 기록이 없어요. 운동을 마치면 여기에 자동으로 쌓여요.</div>`;
  else if(tab==='badges'){const have=new Set(earned());
    body=`${challengeCard()}<div class="badges">${BADGES.map(b=>`<div class="badge ${have.has(b.id)?'on':''}"><span class="bi" aria-hidden="true">${have.has(b.id)?b.ic:'🔒'}</span><b>${b.t}</b><span>${b.d}</span></div>`).join('')}</div>`;
  }
  else if(tab==='days'){
    const logs=[...data.logs].reverse().slice(0,40);
    body=calendar(now)+logs.map(l=>{const idx=data.logs.indexOf(l);
      if(view.edit===idx) return editLog(l,idx);
      return `<div class="log"><div class="log-h"><b>${fmtDay(l.date)}${l.minutes?` <span class="muted small">· ${l.minutes}분</span>`:''}</b><span><button class="icon-btn" data-edit="${idx}">고치기</button><button class="icon-btn" data-del="${idx}">지우기</button></span></div>${pending===idx?`<div class="confirm"><p>이 기록을 지울까요? 되돌릴 수 없어요.</p><div class="duo"><button class="btn btn-danger" data-del-yes="${idx}">지울게요</button><button class="btn btn-soft" data-del-no>취소</button></div></div>`:''}<ul>${(l.items||[]).map(i=>`<li>${esc(i.name)} · ${itemSummary(i)}</li>`).join('')}</ul></div>`}).join('');
  }else{
    const by={};
    data.logs.forEach(l=>(l.items||[]).forEach(i=>{if(i.cardio||!i.records?.length)return;const k=i.id||i.name;(by[k]=by[k]||{name:i.name,id:i.id,s:[]}).s.push({date:l.date,kg:Math.max(...i.records.map(r=>r.kg||0))||null,reps:Math.max(...i.records.map(r=>r.reps||0))})}));
    const rows=Object.values(by).sort((x,y)=>y.s.length-x.s.length);
    body=rows.map(r=>{const last=r.s[r.s.length-1], kgs=r.s.map(x=>x.kg).filter(Boolean), best=kgs.length?Math.max(...kgs):null, first=kgs[0];

      <div class="mstat"><div><span>최고</span><b class="tnum">${best!=null?best+'kg':'—'}</b></div><div><span>최근</span><b class="tnum">${last.kg!=null?last.kg+'kg':'—'} × ${last.reps}회</b></div><div><span>처음보다</span><b class="tnum">${best!=null&&first!=null&&best>first?'+'+(best-first)+'kg':'—'}</b></div></div>

function importFile(file){const fr=new FileReader();fr.onload=()=>importText(fr.result);fr.onerror=()=>toast('파일을 읽지 못했어요. 다시 골라주세요.');fr.readAsText(file)}
function importText(txt,quiet){{try{
    const j=JSON.parse(txt);if(!j||j.app!=='amazing-seokgye'||!j.data||!Array.isArray(j.data.logs))throw 0;
    const nameToId={};Object.entries(EX).forEach(([k,x])=>nameToId[x.name]=k);nameToId['레그프레스']='0';nameToId['시티드 로우']='3';
    const logs=j.data.logs.slice(0,3000).map(l=>({date:String(l.date||''),goal:l.goal||null,minutes:l.minutes||null,items:(l.items||[]).slice(0,30).map(i=>{
      if(i.cardio||i.minutes&&!i.records&&!i.sets) return {cardio:true,name:String(i.name||'걷기'),minutes:+i.minutes||0};
      const recs=Array.isArray(i.records)?i.records.map(r=>({kg:r.kg==null||!isFinite(+r.kg)?null:+r.kg,reps:+r.reps||0})):Array.from({length:Math.min(+i.sets||0,20)},()=>({kg:i.kg==null?null:+i.kg,reps:0}));
      const o={id:i.id!=null&&EX[String(i.id)]?String(i.id):nameToId[i.name]||null,name:String(i.name||''),records:recs,effort:['easy','ok','hard'].includes(i.effort)?i.effort:null};
      if(+i.repMax>0)o.repMax=+i.repMax;if(i.formDrop)o.formDrop=true;return o;
    }),...(l.focus&&FOCUS[l.focus]?{focus:l.focus}:{}),...(l.cls&&TRAINERS[l.cls]?{cls:l.cls}:{})})).filter(l=>!isNaN(new Date(l.date)));
    const seen=new Set(data.logs.map(l=>l.date));let added=0;
    logs.forEach(l=>{if(!seen.has(l.date)){data.logs.push(l);added++}});
    data.logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(!data.profile&&j.data.profile){const p=j.data.profile;data.profile={name:String(p.name||'회원').slice(0,12),goal:GOALS[p.goal]?p.goal:'daily',level:LEVELS[p.level]?p.level:LEVELS[p.exp]?p.exp:'new',age:AGES[p.age]?p.age:ageBand(p.birth),days:+p.days===3?3:2,sex:p.sex==='female'||p.sex==='male'?p.sex:null}}
    if(j.data.equip&&typeof j.data.equip==='object')Object.entries(j.data.equip).forEach(([k,v])=>{if(EX[k]&&typeof v==='string')data.equip[k]=v.slice(0,40)});
    save();if(quiet){if(added){toast(`보관된 기록 ${added}개를 합쳤어요.`);render()}return}toast(added?`기록 ${added}개를 가져왔어요.`:'새로 가져올 기록이 없어요.');render();
  }catch(e){if(!quiet)toast('이 프로그램에서 저장한 기록 파일인지 확인해주세요.')}}
}
